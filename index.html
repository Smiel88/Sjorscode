<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sjorscode.nl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0f1115;
    --surface: #171b23;
    --surface-2: #1e232d;
    --border: #2a3140;
    --text: #e4e7ec;
    --muted: #7a8194;
    --amber: #e8a33d;
    --amber-dim: #8a6626;
    --teal: #5fb3a3;
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    position: relative;
    z-index: 0;
  }

  /* matrix cat backdrop, scrolls with the page, full width */
  body::before{
    content: "";
    position: absolute;
    inset: 0;
    min-height: 100%;
    background-image: url("kat_matrix.webp");
    background-size: 100vw auto;
    background-position: center top;
    background-repeat: no-repeat;
    opacity: 0.92;
    filter: saturate(1.1) contrast(1);
    mask-image: radial-gradient(ellipse 62% 55% at center 24%, black 25%, transparent 92%);
    -webkit-mask-image: radial-gradient(ellipse 62% 55% at center 24%, black 25%, transparent 92%);
    z-index: -3;
  }

  /* animated matrix rain, visible only around the edges (inverse mask), cat stays untouched underneath */
  .rain-layer{
    content: "";
    position: absolute;
    inset: 0;
    min-height: 100%;
    background-image: url("matrix_tile.webp");
    background-size: 225px 150px;
    background-position: center top;
    background-repeat: repeat;
    opacity: 0.5;
    mask-image: radial-gradient(ellipse 62% 55% at center 24%, transparent 25%, black 92%);
    -webkit-mask-image: radial-gradient(ellipse 62% 55% at center 24%, transparent 25%, black 92%);
    animation: rain-fall 7s linear infinite;
    pointer-events: none;
    z-index: -2;
  }

  @keyframes rain-fall{
    from{ background-position: center 0px; }
    to{ background-position: center 150px; }
  }

  @media (prefers-reduced-motion: reduce){
    .rain-layer{ animation: none; }
  }

  body::after{
    content: "";
    position: absolute;
    inset: 0;
    min-height: 100%;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(232,163,61,0.07), transparent),
      radial-gradient(ellipse 700px 400px at 90% 10%, rgba(95,179,163,0.06), transparent),
      linear-gradient(180deg,
        rgba(15,17,21,0.05) 0%,
        rgba(15,17,21,0.12) 22%,
        rgba(15,17,21,0.32) 40%,
        rgba(15,17,21,0.62) 58%,
        var(--bg) 78%
      );
    z-index: -1;
  }

  a { color: inherit; }

  .wrap{
    max-width: 760px;
    margin: 0 auto;
    padding: 42vh 24px 10vh;
  }

  /* ---------- terminal hero ---------- */

  .terminal{
    background: rgba(23,27,35,0.55);
    backdrop-filter: blur(6px) saturate(1.3);
    -webkit-backdrop-filter: blur(6px) saturate(1.3);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.02);
  }

  .terminal-bar{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: rgba(30,35,45,0.55);
    border-bottom: 1px solid var(--border);
  }

  .dot{ width: 11px; height: 11px; border-radius: 50%; }
  .dot.r{ background: #ff5f57; }
  .dot.y{ background: #febc2e; }
  .dot.g{ background: #28c840; }

  .terminal-title{
    margin: 0 auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--muted);
    transform: translateX(-16px);
  }

  .terminal-body{
    padding: 28px 24px 30px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
  }

  .line{ display: flex; gap: 10px; margin-bottom: 4px; opacity: 0; animation: reveal 0.4s ease forwards; }
  .prompt{ color: var(--teal); flex-shrink: 0; user-select: none; }
  .cmd{ color: var(--text); }
  .out{ color: var(--muted); white-space: pre-wrap; }
  .out .hl{ color: var(--amber); }
  .out .hl2{ color: var(--teal); }

  .l1{ animation-delay: 0.1s; }
  .l2{ animation-delay: 0.5s; }
  .l3{ animation-delay: 0.8s; }
  .l4{ animation-delay: 1.9s; }
  .l5{ animation-delay: 2.3s; }
  .l6{ animation-delay: 2.7s; }

  @keyframes reveal{ to{ opacity: 1; } }

  .cursor{
    display: inline-block;
    width: 8px; height: 17px;
    background: var(--amber);
    margin-left: 2px;
    vertical-align: -3px;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink{ 0%, 100%{ opacity: 1; } 50%{ opacity: 0; } }

  /* ---------- directory listing ---------- */

  .site-header{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--text);
    opacity: 0;
    animation: reveal 0.5s ease forwards;
    animation-delay: -0.1s;
  }

  .site-header .amber{ color: var(--amber); }
  .site-header .cursor-blink{
    display: inline-block;
    width: 7px; height: 14px;
    background: var(--amber);
    margin-left: 4px;
    vertical-align: -2px;
    animation: blink 1s step-end infinite;
  }

  .section-label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 20px 0 12px 4px;
    text-transform: uppercase;
    opacity: 0;
    animation: reveal 0.5s ease forwards;
    animation-delay: 0.1s;
  }

  .listing{
    background: rgba(23,27,35,0.55);
    backdrop-filter: blur(6px) saturate(1.3);
    -webkit-backdrop-filter: blur(6px) saturate(1.3);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    opacity: 0;
    animation: reveal 0.5s ease forwards;
    animation-delay: 0.3s;
  }

  .entry{
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    background: transparent;
    text-decoration: none;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s ease, padding-left 0.15s ease;
  }

  .entry:last-child{ border-bottom: none; }

  .entry:hover{
    background: rgba(30,35,45,0.6);
    padding-left: 22px;
  }

  .entry:focus-visible{
    outline: 2px solid var(--amber);
    outline-offset: -2px;
  }

  .entry-perm{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--muted);
    width: 90px;
    flex-shrink: 0;
  }

  .entry-name{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14.5px;
    color: var(--text);
    flex: 1;
  }

  .entry-name .ext{ color: var(--amber); }

  .entry-desc{
    font-size: 13px;
    color: var(--muted);
    display: none;
  }

  @media (min-width: 560px){
    .entry-desc{ display: block; }
  }

  .entry-arrow{
    color: var(--muted);
    font-size: 14px;
  }

  /* ---------- footer ---------- */

  footer{
    margin-top: 56px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--muted);
    text-align: center;
    opacity: 0;
    animation: reveal 0.5s ease forwards;
    animation-delay: 0.5s;
  }

  footer span{ color: var(--amber-dim); }

  @media (max-width: 640px){
    .wrap{ padding-top: 60vh; }
  }

  @media (min-width: 900px){
    body::before{
      left: 50%;
      right: auto;
      width: min(720px, 55vw);
      transform: translateX(-50%);
      background-size: 100% auto;
      background-position: center 4vh;
    }
    .rain-layer{
      left: 50%;
      right: auto;
      width: min(720px, 55vw);
      transform: translateX(-50%);
    }
    .wrap{ padding-top: 52vh; }
  }

  @media (prefers-reduced-motion: reduce){
    .line, .section-label, .listing, footer{ animation: none; opacity: 1; }
    .cursor{ animation: none; }
  }
</style>
</head>
<body>

<div class="rain-layer"></div>
<div class="wrap">

  <p class="site-header">~<span class="amber">/sjorscode.nl</span><span class="cursor-blink"></span></p>

  <p class="section-label">// single Sjors of truth</p>

  <div class="listing">
    <a class="entry" href="https://home.sjorscode.nl" target="_blank" rel="noopener">
      <span class="entry-name">home<span class="ext">/</span></span>
      <span class="entry-desc">Home Assistant</span>
      <span class="entry-arrow">→</span>
    </a>
  </div>

  <footer>sjorscode.nl <span>·</span> laatst bijgewerkt vandaag</footer>

</div>

</body>
</html>
